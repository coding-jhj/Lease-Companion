<text x="80" y="1562" font-family="Malgun Gothic,sans-serif" font-size="18" font-weight="700" fill="#B45309">해석: 발표에 쓸 성능 수치는 초록(운영 경로)이다. 파란 회귀 기준선의 100%는 정규식·BM25 폴백 경로 값이며 서비스 성능이 아니다.</text>
