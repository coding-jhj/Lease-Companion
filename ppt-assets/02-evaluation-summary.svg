<text x="80" y="1624" font-family="Malgun Gothic,sans-serif" font-size="17" fill="#64748B">회색 두 항목은 성능 지표가 아니다 — 완주율은 실패 시 평가가 중단되는 구조, 일반 RAG는 정답 출처 화이트리스트 안에서만 검색된다. 전 구간 합성 test 기준.</text>
